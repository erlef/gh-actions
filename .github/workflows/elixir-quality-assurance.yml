name: Elixir Quality Assurance

on:
  workflow_call:
    inputs:
      elixir-version:
        description: 'Elixir version'
        required: false
        type: string
        default: ''
      otp-version:
        description: 'Erlang/OTP version'
        required: false
        type: string
        default: ''
      mix-env:
        description: 'Mix environment'
        required: false
        type: string
        default: 'test'
      working-directory:
        description: 'Working directory'
        required: false
        type: string
        default: '.'
      test-enabled:
        description: 'Enable testing'
        required: false
        type: boolean
        default: true
      format-enabled:
        description: 'Enable format checking'
        required: false
        type: boolean
        default: true
      credo-enabled:
        description: 'Enable Credo static analysis'
        required: false
        type: boolean
        default: true
      dialyzer-enabled:
        description: 'Enable Dialyzer type checking'
        required: false
        type: boolean
        default: true
      compilation-warnings-enabled:
        description: 'Enable compilation warnings as errors'
        required: false
        type: boolean
        default: true
      security-audit-enabled:
        description: 'Enable security auditing (hex audit, sobelow)'
        required: false
        type: boolean
        default: true
      deps-audit-enabled:
        description: 'Enable dependency auditing (unused deps)'
        required: false
        type: boolean
        default: true
      coverage-enabled:
        description: 'Enable test coverage reporting'
        required: false
        type: boolean
        default: false


jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      elixir-version: ${{ steps.setup-beam.outputs.elixir-version }}
      otp-version: ${{ steps.setup-beam.outputs.otp-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Elixir and OTP
        id: setup-beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ inputs.elixir-version }}
          otp-version: ${{ inputs.otp-version }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ inputs.working-directory }}/deps
            ${{ inputs.working-directory }}/_build
          key: deps-${{ runner.os }}-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-${{ hashFiles(format('{0}/**/mix.lock', inputs.working-directory)) }}
          restore-keys: |
            deps-${{ runner.os }}-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-
            deps-${{ runner.os }}-${{ steps.setup-beam.outputs.elixir-version }}-

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: setup
    if: inputs.test-enabled
    env:
      MIX_ENV: ${{ inputs.mix-env }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Elixir and OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ needs.setup.outputs.elixir-version }}
          otp-version: ${{ needs.setup.outputs.otp-version }}

      - name: Restore dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ inputs.working-directory }}/deps
            ${{ inputs.working-directory }}/_build
          key: deps-${{ runner.os }}-${{ needs.setup.outputs.elixir-version }}-${{ needs.setup.outputs.otp-version }}-${{ hashFiles(format('{0}/**/mix.lock', inputs.working-directory)) }}

      - name: Run tests
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ "${{ inputs.coverage-enabled }}" = "true" ]; then
            mix coveralls.github
          else
            mix test
          fi

  format:
    name: Format Check
    runs-on: ubuntu-latest
    needs: setup
    if: inputs.format-enabled
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Elixir and OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ needs.setup.outputs.elixir-version }}
          otp-version: ${{ needs.setup.outputs.otp-version }}

      - name: Restore dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ inputs.working-directory }}/deps
            ${{ inputs.working-directory }}/_build
          key: deps-${{ runner.os }}-${{ needs.setup.outputs.elixir-version }}-${{ needs.setup.outputs.otp-version }}-${{ hashFiles(format('{0}/**/mix.lock', inputs.working-directory)) }}

      - name: Check formatting
        working-directory: ${{ inputs.working-directory }}
        run: mix format --check-formatted

  credo:
    name: Credo Analysis
    runs-on: ubuntu-latest
    needs: setup
    if: inputs.credo-enabled
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Elixir and OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ needs.setup.outputs.elixir-version }}
          otp-version: ${{ needs.setup.outputs.otp-version }}

      - name: Restore dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ inputs.working-directory }}/deps
            ${{ inputs.working-directory }}/_build
          key: deps-${{ runner.os }}-${{ needs.setup.outputs.elixir-version }}-${{ needs.setup.outputs.otp-version }}-${{ hashFiles(format('{0}/**/mix.lock', inputs.working-directory)) }}

      - name: Run Credo
        working-directory: ${{ inputs.working-directory }}
        run: mix credo

  dialyzer:
    name: Dialyzer Type Check
    runs-on: ubuntu-latest
    needs: setup
    if: inputs.dialyzer-enabled
    env:
      MIX_ENV: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Elixir and OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ needs.setup.outputs.elixir-version }}
          otp-version: ${{ needs.setup.outputs.otp-version }}

      - name: Restore dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ inputs.working-directory }}/deps
            ${{ inputs.working-directory }}/_build
          key: deps-${{ runner.os }}-${{ needs.setup.outputs.elixir-version }}-${{ needs.setup.outputs.otp-version }}-${{ hashFiles(format('{0}/**/mix.lock', inputs.working-directory)) }}

      - name: Cache PLT files
        uses: actions/cache@v4
        with:
          path: ${{ inputs.working-directory }}/priv/plts
          key: plt-${{ runner.os }}-${{ needs.setup.outputs.elixir-version }}-${{ needs.setup.outputs.otp-version }}-${{ hashFiles(format('{0}/**/mix.lock', inputs.working-directory)) }}
          restore-keys: |
            plt-${{ runner.os }}-${{ needs.setup.outputs.elixir-version }}-${{ needs.setup.outputs.otp-version }}-

      - name: Create PLT directory
        working-directory: ${{ inputs.working-directory }}
        run: mkdir -p priv/plts

      - name: Run Dialyzer
        working-directory: ${{ inputs.working-directory }}
        run: mix dialyzer --format github

  compilation:
    name: Compilation Warnings
    runs-on: ubuntu-latest
    needs: setup
    if: inputs.compilation-warnings-enabled
    env:
      MIX_ENV: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Elixir and OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ needs.setup.outputs.elixir-version }}
          otp-version: ${{ needs.setup.outputs.otp-version }}

      - name: Restore dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ inputs.working-directory }}/deps
            ${{ inputs.working-directory }}/_build
          key: deps-${{ runner.os }}-${{ needs.setup.outputs.elixir-version }}-${{ needs.setup.outputs.otp-version }}-${{ hashFiles(format('{0}/**/mix.lock', inputs.working-directory)) }}

      - name: Compile with warnings as errors
        working-directory: ${{ inputs.working-directory }}
        run: mix compile --warnings-as-errors --force

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: setup
    if: inputs.security-audit-enabled
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Elixir and OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ needs.setup.outputs.elixir-version }}
          otp-version: ${{ needs.setup.outputs.otp-version }}

      - name: Restore dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ inputs.working-directory }}/deps
            ${{ inputs.working-directory }}/_build
          key: deps-${{ runner.os }}-${{ needs.setup.outputs.elixir-version }}-${{ needs.setup.outputs.otp-version }}-${{ hashFiles(format('{0}/**/mix.lock', inputs.working-directory)) }}

      - name: Run Hex audit
        working-directory: ${{ inputs.working-directory }}
        run: mix hex.audit

      - name: Run Sobelow security analysis
        working-directory: ${{ inputs.working-directory }}
        run: |
          if mix deps | grep -q sobelow; then
            mix sobelow --config
          else
            echo "Sobelow not found in dependencies, skipping..."
          fi

  deps-audit:
    name: Dependencies Audit
    runs-on: ubuntu-latest
    needs: setup
    if: inputs.deps-audit-enabled
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Elixir and OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ needs.setup.outputs.elixir-version }}
          otp-version: ${{ needs.setup.outputs.otp-version }}

      - name: Restore dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ inputs.working-directory }}/deps
            ${{ inputs.working-directory }}/_build
          key: deps-${{ runner.os }}-${{ needs.setup.outputs.elixir-version }}-${{ needs.setup.outputs.otp-version }}-${{ hashFiles(format('{0}/**/mix.lock', inputs.working-directory)) }}

      - name: Check for unused dependencies
        working-directory: ${{ inputs.working-directory }}
        run: mix deps.unlock --check-unused